services:
  - type: web
    name: afghan-top-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: afghan-top-db
          property: connectionString
      - key: SEND_AF_TOKEN
        sync: false
      - key: SEND_AF_BASE_URL
        value: "https://www.send.af/api"
      - key: SEND_AF_TIMEOUT_SECONDS
        value: "20"
      - key: SEND_AF_MIN_AMOUNT
        value: "50"
      - key: SEND_AF_MAX_AMOUNT
        value: "4000"

databases:
  - name: afghan-top-db
    plan: free
    databaseName: afghan_top
    user: afghan_top_user
